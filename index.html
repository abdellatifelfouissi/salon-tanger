 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كتالوغ الصالونات المغربية</title>
<meta name="description" content="أجمل الصالونات المغربية، سدادر ووسادات بجودة عالية. تواصل معنا عبر واتساب.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6ef; --card:#ffffff; --ink:#2a1d14; --muted:#7a6a5c;
  --gold:#b8892e; --gold-2:#e3b95c; --brown:#3b2415; --green:#25d366; --green-d:#1da851;
  --radius:20px; --shadow:0 10px 30px rgba(59,36,21,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
body.locked{overflow:hidden}

/* ===== Gate ===== */
#gate{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  background:
    radial-gradient(circle at 20% 15%,rgba(227,185,92,.25),transparent 45%),
    radial-gradient(circle at 80% 85%,rgba(184,137,46,.2),transparent 45%),
    linear-gradient(160deg,#2b1a0f,#4a2e1a 60%,#2b1a0f);
  transition:opacity .5s ease,visibility .5s ease;
}
#gate.hide{opacity:0;visibility:hidden}
.gate-box{
  width:100%;max-width:420px;text-align:center;color:#fff;
  background:rgba(255,255,255,.06);backdrop-filter:blur(12px);
  border:1px solid rgba(227,185,92,.35);border-radius:28px;padding:36px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);animation:rise .7s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.gate-logo{font-size:44px;margin-bottom:6px}
.gate-box h1{font-size:26px;font-weight:900;color:var(--gold-2);margin-bottom:6px}
.gate-box p{font-size:15px;color:#e8dccb;margin-bottom:28px}
.gbtn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:16px;border-radius:16px;font:700 17px 'Cairo',sans-serif;text-decoration:none;
  cursor:pointer;border:0;margin-bottom:14px;transition:transform .2s,box-shadow .2s;
}
.gbtn:hover{transform:translateY(-2px)}
.gbtn.primary{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#2b1a0f;box-shadow:0 8px 22px rgba(227,185,92,.4)}
.gbtn.secondary{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5)}
.gbtn.secondary:hover{background:rgba(255,255,255,.1)}

/* ===== Header ===== */
header{
  background:linear-gradient(135deg,var(--brown),#5b3820);color:#fff;text-align:center;
  padding:64px 20px 70px;position:relative;overflow:hidden;
}
header::after{
  content:"";position:absolute;inset:auto 0 0 0;height:30px;background:var(--bg);
  border-radius:50% 50% 0 0/100% 100% 0 0;
}
header .tag{display:inline-block;background:rgba(227,185,92,.2);color:var(--gold-2);padding:4px 16px;border-radius:99px;font-size:13px;font-weight:600;margin-bottom:14px}
header h2{font-size:clamp(28px,6vw,46px);font-weight:900;line-height:1.3}
header h2 span{color:var(--gold-2)}
header p{max-width:560px;margin:12px auto 0;color:#e8dccb}

/* ===== Grid ===== */
main{max-width:1180px;margin:0 auto;padding:30px 18px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px;font-size:17px}
.card{
  background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s;
  opacity:0;transform:translateY(20px);
}
.card.in{opacity:1;transform:none;transition:opacity .6s,transform .6s,box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(59,36,21,.2)}
.thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:#e9dcc6}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s;cursor:zoom-in}
.card:hover .thumb img{transform:scale(1.06)}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;color:rgba(255,255,255,.85)}
.badge{position:absolute;top:12px;right:12px;background:var(--gold);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px}
.num{position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:19px;font-weight:700}
.body p{font-size:14px;color:var(--muted);flex:1}
.price{font-size:14px;font-weight:700;color:var(--gold)}
.wa{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;
  background:var(--green);color:#fff;text-decoration:none;font-weight:700;padding:12px;border-radius:14px;
  transition:background .2s,transform .2s;
}
.wa:hover{background:var(--green-d);transform:scale(1.02)}
.wa svg{width:22px;height:22px;fill:#fff}

/* ===== Lightbox ===== */
#lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb.show{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:12px}

/* ===== Footer & floating ===== */
footer{background:var(--brown);color:#e8dccb;text-align:center;padding:30px 18px;font-size:14px}
footer a{color:var(--gold-2);text-decoration:none;font-weight:700}
.float{
  position:fixed;bottom:20px;left:20px;z-index:50;width:58px;height:58px;border-radius:50%;
  background:var(--green);display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(37,211,102,.5);animation:pulse 2s infinite;
}
.float svg{width:32px;height:32px;fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%{box-shadow:0 0 0 16px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
</style>
</head>
<body class="locked">

<!-- ===== Gate ===== -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">🛋️</div>
    <h1>مرحبا بيك</h1>
    <p>اختار واش بغيتي تشوف الكتالوغ ولا تعرف فين المحل ديالنا</p>
    <button class="gbtn primary" id="enterBtn">👁️ رؤية الكتالوغ</button>
    <a class="gbtn secondary" id="mapsBtn" target="_blank" rel="noopener">📍 Google Maps ديال المحل</a>
  </div>
</div>

<header>
  <span class="tag">✨ صنع مغربي أصيل</span>
  <h2>أجمل <span>الصالونات المغربية</span></h2>
  <p>سدادر ووسادات بجودة عالية وتشطيب راقي. اختار الصالون اللي عجبك وتواصل معنا مباشرة عبر واتساب.</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  للطلب والاستفسار: <a id="footerWa" target="_blank" rel="noopener">0610845988</a>
</footer>

<a class="float" id="floatWa" target="_blank" rel="noopener" aria-label="واتساب">
  <svg viewBox="0 0 32 32"><path d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.8 2 6.8L3 29l6.6-2c1.9 1 4 1.6 6.3 1.6 7.2 0 13-5.7 13-12.8S23.200 3 16 3zm0 23.300c-2 0-3.900-.6-5.500-1.600l-.4-.2-3.900 1.200 1.200-3.800-.3-.4c-1.100-1.700-1.700-3.600-1.700-5.600C5.400 9.900 10.200 5.300 16 5.300s10.600 4.600 10.600 10.500S21.800 26.300 16 26.300zm5.800-7.900c-.3-.2-1.900-.9-2.200-1-.3-.1-.5-.2-.7.200-.2.300-.8 1-1 1.200-.2.200-.4.200-.7.100-.3-.2-1.400-.5-2.600-1.600-1-.9-1.600-1.900-1.800-2.300-.2-.3 0-.5.100-.7.100-.1.300-.4.500-.5.200-.2.200-.3.300-.5.100-.2.100-.4 0-.5-.1-.2-.7-1.700-1-2.300-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400-.3.300-1 1-1 2.500s1.100 2.900 1.200 3.100c.2.200 2.100 3.300 5.200 4.500 3 1.200 3 .8 3.600.8.600-.1 1.900-.8 2.200-1.500.3-.7.300-1.400.2-1.500-.1-.1-.3-.2-.6-.4z"/></svg>
</a>

<div id="lb"><img alt=""></div>

<script>
/* ⚙️ الإعدادات: بدل غير رابط Google Maps */
const CONFIG = {
  whatsapp: "212610845988",
  phoneDisplay: "0610845988",
  mapsUrl: "https://www.google.com/maps/search/?api=1&query=Tanger+Maroc"
};

/* ============ كود الموقع (ما تبدل فيه والو) ============ */
const WA_ICON = document.getElementById('floatWa').innerHTML;
const waLink = (text) => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(text)}`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Gate
document.getElementById('mapsBtn').href = CONFIG.mapsUrl;
document.getElementById('enterBtn').addEventListener('click', () => {
  document.getElementById('gate').classList.add('hide');
  document.body.classList.remove('locked');
  revealCards();
});

// Links
document.getElementById('floatWa').href = waLink('السلام عليكم، بغيت نستفسر على الصالونات.');
const fw = document.getElementById('footerWa');
fw.href = waLink('السلام عليكم، بغيت نستفسر على الصالونات.');
fw.textContent = CONFIG.phoneDisplay;

// Lightbox
const lb = document.getElementById('lb');
lb.addEventListener('click', () => lb.classList.remove('show'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('show'); });

// Catalog: كيتحمل من data.json (اللي كيعمرو البوت ديال تلغرام)
async function loadCatalog(){
  const grid = document.getElementById('grid');
  let salons = [];
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    salons = await r.json();
  } catch (e) {}

  if (!Array.isArray(salons) || !salons.length) {
    grid.innerHTML = '<p class="empty">غادي نزيدو الصالونات قريبا ✨</p>';
    return;
  }

  grid.innerHTML = salons.map((s, i) => `
    <article class="card">
      <div class="thumb" style="background:linear-gradient(135deg,${esc(s.color || '#8b5a2b')},#d9b66b)">
        <div class="ph">🛋️</div>
        <img src="${esc(s.img)}" alt="${esc(s.name)}" loading="lazy" onerror="this.remove()">
        ${s.badge ? `<span class="badge">${esc(s.badge)}</span>` : ''}
        <span class="num">${i + 1}</span>
      </div>
      <div class="body">
        <h3>${esc(s.name)}</h3>
        <p>${esc(s.desc)}</p>
        <div class="price">${s.price ? esc(s.price) : 'اطلب الثمن عبر واتساب'}</div>
        <a class="wa" target="_blank" rel="noopener"
           href="${waLink(`السلام عليكم، بغيت نعرف الثمن والتفاصيل ديال: ${s.name}`)}">
          ${WA_ICON} تواصل عبر واتساب
        </a>
      </div>
    </article>`).join('');

  grid.querySelectorAll('.thumb img').forEach(img => {
    img.addEventListener('click', () => {
      lb.querySelector('img').src = img.src;
      lb.classList.add('show');
    });
  });

  if (!document.body.classList.contains('locked')) revealCards();
}

function revealCards(){
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e, idx) => {
      if (e.isIntersecting) {
        setTimeout(() => e.target.classList.add('in'), (idx % 4) * 90);
        io.unobserve(e.target);
      }
    });
  }, { threshold: .1 });
  document.querySelectorAll('.card:not(.in)').forEach(c => io.observe(c));
}

loadCatalog();
</script>
</body>
</html>
