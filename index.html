 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salonat - Tanger</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:white;text-align:center}
.top{padding:25px 15px}
.top h1{font-size:24px;margin:0}
.top p{color:#ccc;font-size:14px}
.btn{display:block;margin:12px auto;padding:16px;width:85%;max-width:380px;border-radius:14px;font-size:19px;font-weight:bold;text-decoration:none}
.btn-catalog{background:#d4a017;color:white}
.btn-maps{background:white;color:#111}
#catalog{padding:15px;background:#fff8f0;color:#111;min-height:300px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:white;padding:10px;border-radius:12px;box-shadow:0 2px 8px #ddd}
.card img{width:100%;height:140px;object-fit:cover;border-radius:10px}
.card h3{margin:8px 0 3px;font-size:15px}
.card p{font-size:12px;color:#777;margin:0}
.wa{display:block;margin-top:8px;padding:9px;background:#25D366;color:white;border-radius:8px;font-weight:bold;text-decoration:none;font-size:13px}
</style>
</head>
<body>

<div class="top">
<h1>🛋️ Salonat - Tanger</h1>
<p>سدادر و صالونات على حسب الطلب</p>
<a class="btn btn-catalog" href="#catalog">📖 Voir le catalogue</a>
<a class="btn btn-maps" href="https://www.google.com/maps/search/?api=1&query=Salonat+Tanger" target="_blank">📍 Google Maps</a>
</div>

<div id="catalog">
<h2>Catalogue</h2>
<div class="grid" id="grid"></div>
<p id="empty" style="display:none">باقي ما كاين حتى تصويرة، سيفط لينا فتيليغرام</p>
</div>

<script>
async function load(){
  try{
    const res = await fetch('catalog.json?t='+Date.now());
    const data = await res.json();
    const grid = document.getElementById('grid');
    if(!data.length){ document.getElementById('empty').style.display='block'; return; }
    grid.innerHTML = data.map(item => `
      <div class="card">
        <img src="${item.image}">
        <h3>${item.title}</h3>
        <p>${item.price || ''}</p>
        <a class="wa" href="https://wa.me/212610845988?text=${encodeURIComponent('Bonjour, bghit '+item.title)}">💬 Commander</a>
      </div>
    `).join('');
  }catch(e){ document.getElementById('empty').style.display='block'; }
}
load();
</script>
</body>
</html>
